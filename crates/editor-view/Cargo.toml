[package]
name = "editor-view"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
gpui-kit.workspace = true
core-buffer = { path = "../core-buffer" }
core-syntax = { path = "../core-syntax" }
core-lsp = { path = "../core-lsp" }
core-workspace = { path = "../core-workspace" }
serde_json.workspace = true
smol.workspace = true
async-channel.workspace = true

[dev-dependencies]
# GPUI's own headless test platform (`TestAppContext`, simulated keystrokes).
# gpui-kit's umbrella `test-support` feature drags in platform crates whose
# pinned versions conflict with this lockfile, so use gpui directly.
gpui = { package = "gpui-pre", version = "=0.3.9", features = ["test-support"] }
