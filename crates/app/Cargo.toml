[package]
name = "app"
version = "0.0.1+1"
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "dart-ide"
path = "src/main.rs"

[dependencies]
gpui-kit.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp", "ico", "tiff"] }
async-channel.workspace = true
alacritty_terminal.workspace = true
libc = "0.2"
base64 = "0.22"
wry = { version = "0.57", default-features = false, features = ["devtools"] }
core-buffer = { path = "../core-buffer" }
core-flutter = { path = "../core-flutter" }
core-syntax = { path = "../core-syntax" }
core-lsp = { path = "../core-lsp" }
core-dap = { path = "../core-dap" }
core-workspace = { path = "../core-workspace" }
editor-view = { path = "../editor-view" }
core-jupyter = { path = "../core-jupyter" }
trash = "5"

[dev-dependencies]
# GPUI's headless test platform, for rendering views in tests (same pin as
# editor-view; gpui-kit's own test-support feature conflicts with the lockfile).
gpui = { package = "gpui-pre", version = "=0.3.9", features = ["test-support"] }

# Native macOS notifications attributed to the app's own bundle id (osascript's
# `display notification` shows up as "Script Editor").
[target.'cfg(target_os = "macos")'.dependencies]
mac-notification-sys = "0.6"
