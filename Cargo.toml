[workspace]
resolver = "2"
members = [
    "crates/core-buffer",
    "crates/core-syntax",
    "crates/core-lsp",
    "crates/core-dap",
    "crates/core-flutter",
    "crates/core-workspace",
    "crates/editor-view",
    "crates/app",
]

[workspace.package]
edition = "2024"
license = "MIT"

[workspace.dependencies]
gpui-kit = "0.8.0"
anyhow = "1"
ropey = "2.0.0-beta.1"
tree-sitter = "0.27.1"
tree-sitter-dart = "0.2.0"
lsp-types = "0.97.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-channel = "2"
smol = "2"
