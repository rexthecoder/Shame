[workspace]
resolver = "2"
members = [
    "crates/core-buffer",
    "crates/core-syntax",
    "crates/core-lsp",
    "crates/core-dap",
    "crates/core-flutter",
    "crates/core-workspace",
    "crates/editor-view",
    "crates/app",
    "crates/bench",
]

[workspace.package]
edition = "2024"
license = "MIT"

[workspace.dependencies]
gpui-kit = "0.8.0"
anyhow = "1"
ropey = "2.0.0-beta.1"
# File search + content grep for the workspace: one memory-resident index per
# project instead of a full filesystem walk per keystroke.
fff-search = "0.11"
tree-sitter = "0.27.1"
tree-sitter-dart = "0.2.0"
lsp-types = "0.97.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-channel = "2"
smol = "2"
# The dock terminal: VT parser + grid + PTY event loop (the same engine Alacritty and Zed use).
alacritty_terminal = "0.26"

# Debug builds decode a full-resolution simulator frame several times a second; unoptimized
# image/GPU code makes the embedded simulator crawl. Optimize dependencies and our own code lightly.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
