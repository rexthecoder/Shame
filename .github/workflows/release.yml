name: Release

# Push a tag like v0.1.0 to build a universal macOS .dmg and attach it to a
# GitHub Release. Run it manually (Actions tab) to get the build as a
# downloadable workflow artifact without publishing anything.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches the Makefile version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          makefile_version="$(awk '$1 == "VERSION" && $2 == ":=" { print $3; exit }' Makefile)"
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$makefile_version" != "$tag_version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match Makefile VERSION $makefile_version" >&2
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --workspace

      # Optional: sign with a Developer ID certificate when these secrets exist.
      # Without them the build is ad-hoc signed and macOS shows a Gatekeeper warning.
      #   MACOS_CERTIFICATE          base64 of the exported .p12
      #   MACOS_CERTIFICATE_PASSWORD password of the .p12
      #   MACOS_SIGN_IDENTITY        e.g. "Developer ID Application: Your Name (TEAMID)"
      - name: Import signing certificate
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
        run: |
          if [ -z "$MACOS_CERTIFICATE" ] || [ -z "$MACOS_SIGN_IDENTITY" ]; then
            echo "No signing secrets set; building ad-hoc signed."
            exit 0
          fi
          keychain="$RUNNER_TEMP/build.keychain-db"
          keychain_password="$(uuidgen)"
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -P "$MACOS_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -s \
            -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"
          echo "CODESIGN_IDENTITY=$MACOS_SIGN_IDENTITY" >> "$GITHUB_ENV"

      - name: Build universal app and dmg
        run: scripts/build-mac.sh --arch universal

      - uses: actions/upload-artifact@v4
        with:
          name: shame-macos-universal
          path: |
            dist/*.dmg
            dist/*.dmg.sha256

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.dmg dist/*.dmg.sha256 \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
